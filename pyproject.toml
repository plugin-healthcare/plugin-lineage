[project]
name = "plugin-lineage"
version = "0.1.0"
description = "Column-level data lineage inference for Python-based data pipelines"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Data models
    "pydantic>=2.0",             # Typed data models with validation
    "pyyaml>=6.0",               # YAML serialization for Pydantic models
    # Inference
    "sqlglot>=25.0.0",          # SQL parsing + sqlglot.lineage for column-level lineage
    "polars>=1.0.0",             # DataFrame lineage via LazyFrame.serialize(format="json")
    "pyarrow>=17.0.0",           # Canonical type system; Arrow schema serialization
    # Persistence
    "linkml>=1.8.0",             # LinkML ClassDefinitions for schema YAML
    "linkml-map>=0.5.0",         # TransformationSpecification / SlotDerivation for column mappings
    # Orchestration
    "dagster>=1.8.0",            # AssetMaterialization sensor for plan capture
    # CLI
    "typer>=0.12.0",             # CLI framework
    "rich>=13.0.0",              # Terminal tables, trees, and diffs
    "questionary>=2.0.0",        # Interactive prompts for `plugin-lineage name`
]

[project.scripts]
plugin-lineage = "lineage.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.0",
]
